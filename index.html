  if(Notification.permission==="granted"){if(manual)toast("الإشعارات مفعّلة بالفعل ✅");return}

function playPing(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.setValueAtTime(880,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(587.33,ctx.currentTime+0.14);
    g.gain.setValueAtTime(0.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+0.19);
  }catch(e){}
}
function triggerNotify(title,bodyText,chatTarget){
  playPing();
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  if(!document.hidden&&cur===chatTarget)return;
  try{
    const n=new Notification(title,{body:bodyText,icon:"icon-192.png",tag:"frindy-"+(chatTarget||"msg")});
    n.onclick=()=>{window.focus();if(chatTarget)openChat(chatTarget);n.close()};

function editImageSheet(file,maxSize=960,allowViewOnce=true){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let rot=0,filter="none",cropMode="full",viewOnce=false;
        const canvas=h("canvas");
        const ctx=canvas.getContext("2d");
        const redraw=()=>{
          const swap=(rot%180)!==0;
          const rw=swap?img.height:img.width;
          const rh=swap?img.width:img.height;
          let sx=0,sy=0,cw=rw,ch=rh;
          if(cropMode==="square"){
            const side=Math.min(rw,rh);
            sx=(rw-side)/2;sy=(rh-side)/2;cw=side;ch=side;
          }else if(cropMode==="center"){
            sx=rw*.08;sy=rh*.08;cw=rw*.84;ch=rh*.84;
          }
          const scale=Math.min(1,maxSize/Math.max(cw,ch));
          canvas.width=Math.max(1,Math.round(cw*scale));
          canvas.height=Math.max(1,Math.round(ch*scale));

          const temp=document.createElement("canvas");
          temp.width=rw;temp.height=rh;
          const tctx=temp.getContext("2d");
          tctx.translate(rw/2,rh/2);
          tctx.rotate(rot*Math.PI/180);
          tctx.drawImage(img,-img.width/2,-img.height/2);

          ctx.save();
          if(filter==="bw")ctx.filter="grayscale(100%)";
          else if(filter==="vivid")ctx.filter="saturate(145%) contrast(108%)";
          else ctx.filter="none";
          ctx.drawImage(temp,sx,sy,cw,ch,0,0,canvas.width,canvas.height);
          ctx.restore();
        };
        redraw();
        let done=false;
        const finish=val=>{if(done)return;done=true;o.remove();resolve(val)};
        const voBtn=allowViewOnce?h("button",{
          class:"sec",
          onclick:()=>{viewOnce=!viewOnce;voBtn.textContent=viewOnce?"👁️ عرض مرة واحدة: مفعّل":"👁️ عرض مرة واحدة: إيقاف"}
        },"👁️ عرض مرة واحدة: إيقاف"):null;
        const o=sheet(
          h("h3",{},"تعديل وقص الصورة"),
          h("div",{class:"crop-stage"},canvas),
          h("div",{class:"seg",style:"margin:0"},
            [["full","كاملة"],["square","مربع 1:1"],["center","تقريب"]].map(([k,lbl])=>h("button",{
              class:cropMode===k?"on":"",
              onclick:e=>{cropMode=k;e.currentTarget.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on"));e.currentTarget.classList.add("on");redraw()}
            },lbl))
          ),
          h("div",{class:"seg",style:"margin:0"},
            [["none","عادي"],["vivid","حيوي"],["bw","أبيض وأسود"]].map(([k,lbl])=>h("button",{
              class:filter===k?"on":"",
              onclick:e=>{filter=k;e.currentTarget.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on"));e.currentTarget.classList.add("on");redraw()}
            },lbl))
          ),
          h("div",{style:"display:flex;gap:8px"},
            h("button",{class:"sec",style:"flex:1",onclick:()=>{rot=(rot+90)%360;redraw()}},"↻ تدوير 90°"),
            voBtn
          ),
          h("button",{class:"pri",onclick:()=>finish({url:canvas.toDataURL("image/jpeg",.68),viewOnce})},"إرسال / اعتماد الصورة"),
          h("button",{class:"sec red",onclick:()=>finish(null)},"إلغاء")
        );
      };
      img.onerror=()=>{toast("تعذر قراءة الصورة");resolve(null)};
      img.src=reader.result;
    };
    reader.onerror=()=>{toast("تعذر قراءة الملف");resolve(null)};
    reader.readAsDataURL(file);
  });
}
