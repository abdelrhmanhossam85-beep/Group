<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الفحوله</title>
<style>
:root{--brand:#800020;--brand2:#5c0017;--bg:#fff;--chat:#f4eced;--in:#fff;--out:#f3d5dc;--text:#1d1517;--muted:#7a6a6e;--line:#eadfe2;--ok:#2bb673;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--brand:#8f1534;--bg:#171011;--chat:#1d1315;--in:#2b1d20;--out:#6a1c30;--text:#f4eaec;--muted:#aa979c;--line:#33262a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:10}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#login{height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--brand2),var(--brand));padding:16px;box-sizing:border-box}
.card{background:var(--bg);border-radius:20px;padding:28px 22px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.logo{width:64px;height:64px;border-radius:50%;background:var(--brand);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto}
.card h1{margin:0;font-size:22px}
.card input,.sheet input,.sheet textarea{border:1px solid var(--line);background:var(--chat);border-radius:12px;padding:12px;outline:none;width:100%;box-sizing:border-box;text-align:start}
.card button,.sheet .pri{background:var(--brand);color:#fff;border-radius:12px;padding:12px;font-weight:600}
#le{color:#d33;margin:0;min-height:1.2em;font-size:14px}
.app{display:grid;grid-template-columns:340px 1fr;height:100%}
#side{display:flex;flex-direction:column;border-inline-end:1px solid var(--line);min-height:0;background:var(--bg)}
#side header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px}
#side header b{flex:1;font-size:18px}
#addst{color:#fff;background:rgba(255,255,255,.18);border-radius:16px;padding:6px 12px;font-size:13px}
#strow{display:flex;gap:12px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line)}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);min-width:56px}
#list{overflow-y:auto;flex:1}
.it{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;text-align:start;border-bottom:1px solid var(--line)}
.it:hover,.it.on{background:var(--chat)}
.it .tx{flex:1;min-width:0}
.it .n{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.it .n small{color:var(--muted);font-weight:400;font-size:11px}
.it .p{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{position:relative;flex:none;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.av.ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brand)}
.dot{position:absolute;bottom:0;inset-inline-end:0;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
#main{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--chat)}
.empty{margin:auto;color:var(--muted)}
#chat{display:flex;flex-direction:column;height:100%;min-height:0}
#ch{background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
#ch .t{flex:1;min-width:0}
#ch .t b{display:block}
#ch .t small{opacity:.85}
#bk{display:none;color:#fff;font-size:22px;padding:0 4px}
#pin{background:var(--bg);border-bottom:1px solid var(--line);padding:6px 14px;font-size:13px;color:var(--muted)}
#ms{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:7px 11px;border-radius:14px;background:var(--in);align-self:flex-start;word-break:break-word;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.b.me{background:var(--out);align-self:flex-end}
.b .s{font-size:12px;font-weight:700;color:var(--brand);margin-bottom:2px}
.b .m{font-size:10px;color:var(--muted);text-align:end;margin-top:2px}
#cp{display:flex;gap:8px;padding:8px 10px;background:var(--bg);border-top:1px solid var(--line)}
#cp input{flex:1;border:1px solid var(--line);background:var(--chat);border-radius:22px;padding:11px 16px;outline:none}
#sd{background:var(--brand);color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;max-height:85%;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0;text-align:center}
.sheet .row{display:flex;align-items:center;gap:10px;padding:6px 0}
.sheet .sec{background:var(--chat);border-radius:12px;padding:12px;text-align:center}
.sheet .red{color:#d33;padding:10px}
.badge{background:var(--brand);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px}
.fahl{background:var(--brand);color:#fff;border-radius:14px;padding:4px 14px;font-weight:700;align-self:center}
.sw{display:flex;gap:8px;justify-content:center}
.sw i{width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw i.on{border-color:var(--text)}
.sv{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:24px;text-align:center;font-size:24px}
.sv .top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:16px;display:flex;justify-content:space-between;font-size:14px}
.b img,.b video{max-width:100%;border-radius:10px;display:block;max-height:320px}.b audio{max-width:100%}.b.del{font-style:italic;color:var(--muted)}#cp button.ic{font-size:20px;width:40px}#cp button.rec{background:#d33;color:#fff;border-radius:50%}.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}.sv img,.sv video{max-width:100%;max-height:60%;border-radius:12px}#lk{padding:12px;text-align:center;color:var(--muted);background:var(--bg)}
#tt{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;font-size:14px}
@media (max-width:720px){.app{grid-template-columns:1fr}#main{display:none}.app.open #side{display:none}.app.open #main{display:flex}#bk{display:block}}
</style>
</head>
<body>
<div id="login"><div class="card"><div class="logo">ف</div><h1>الفحوله</h1>
<input id="lu" placeholder="اليوزر مثلاً adam" autocapitalize="off" autocomplete="username">
<input id="lp" type="password" placeholder="الباسورد" autocomplete="current-password">
<button id="lb">دخول</button><p id="le"></p></div></div>
<div id="app" class="app" hidden>
<aside id="side"><header><div id="me"></div><b>الفحوله</b><button id="ed" style="color:#fff;font-size:18px">✎</button><button id="addst">＋ استوري</button></header><div id="strow"></div><div id="list"></div></aside>
<section id="main"><div class="empty" id="empty">اختار محادثة من القايمة</div>
<div id="chat" hidden><div id="ch"><button id="bk">›</button><div id="chav"></div><div class="t"><b id="cn"></b><small id="cs"></small></div></div><div id="pin" hidden></div><div id="ms"></div>
<div id="lk" hidden></div><div id="cp"><button class="ic" id="at">📎</button><input id="fi" type="file" accept="image/*,video/*,audio/*" hidden><input id="mi" placeholder="اكتب رسالة" autocomplete="off"><button class="ic" id="mc">🎤</button><button id="sd">➤</button></div></div></section>
</div>
<script type="module">

const app=initializeApp({apiKey:"AIzaSyAGAXzchZ5SEBxUedrXmlJM8ixSrhxd2oA",authDomain:"group-24346.firebaseapp.com",projectId:"group-24346",storageBucket:"group-24346.firebasestorage.app",messagingSenderId:"384777337839",appId:"1:384777337839:web:d7173505af3be5f712941a"});
const auth=getAuth(app),F=getFirestore(app);
const db={collection:c=>({add:x=>addDoc(collection(F,c),x),doc:id=>({set:x=>setDoc(doc(F,c,id),x),update:x=>updateDoc(doc(F,c,id),x),delete:()=>deleteDoc(doc(F,c,id))})})};
const U={"adam": "35189c7e3f17af4b6fc3de725b6503bbfaad37818201737909097445c9fe94a9", "sardoby": "f680e5393a693dba523c5e2a8ec6cb593b88b2cc2590cd9fddf9e6fef5ff3b0c", "ali": "42d94f3fdeaa7c9251442e7ec910dc81661c809348ab04989a9687037d752512", "farok": "8b2bf781bff7e6196855138b114608bbe10737661d2dc1c1b0f480917c048887", "kimo": "079c6ccddf319583d0b1befa34f0007f67bcc177aa487e048b299926c929d431", "zizoo": "a2bc29923c39924ea07cfcc5d99ef7a19f087a42de6eae9e4ff5ae41468c73d1", "zizo": "0f40d72b4f6c2946b64d8ca86dcac2a16816a1b4cdca7476102ea004865a780f", "alzoz": "e487702cb2665ac292a5561841e8000b04c5769742f0b07c5d71e66161bf7d5c", "sa3pan": "43b4c5832b1bf0d4f52a636ac858905fd8b1a8bd55702fe000f5b4a9bb497850", "amroo": "e6213eee264ce86b8683fb3c1f9eb65d5b7ef7e7ae5af731d9c2016bbc48e600", "riyad": "c6b1e9c77c74268e890a7f11c58b8a1e8d48043d8e974d757bfd021b253b37df"};

const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}for(const c of k.flat(Infinity))if(c!=null)e.append(c);return e};
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
let me,cur=null,msgs=[],pres={},prof={},stories=[],meta={};

function av(u,s=44){const g=u==="g";const e=h("div",{class:"av"+(!g&&hasSt(u)?" ring":""),style:`width:${s}px;height:${s}px;font-size:${s*.45}px;background:${g?"#5c0017":COL[ORDER.indexOf(u)%COL.length]}`},(g?meta.gimg:(prof[u]||{}).img)&&(g?meta.gimg:prof[u].img).startsWith("data:")?h("img",{src:g?meta.gimg:prof[u].img}):g?"ف":u[0].toUpperCase());if(!g&&online(u)&&u!==me)e.append(h("i",{class:"dot"}));return e}
const online=u=>u===me||Date.now()-(pres[u]||0)<50000;
const cid=u=>u==="g"?"g":[me,u].sort().join("|");

const gname=()=>meta.gname||"الفحوله";const dn=u=>(prof[u]||{}).name||"\u200e@"+u+"\u200e";const pv=m=>m.del?"🚫 رسالة محذوفة":m.kind?({image:"📷 صورة",video:"🎥 فيديو",audio:"🎤 صوت"})[m.kind]:m.text;

/* login */
async function tryLogin(n,p){n=n.trim().replace(/^@/,"").toLowerCase();if(!U[n])return false;return(await sha(SALT+n+":"+p))===U[n]?n:false}
$("#lb").onclick=async()=>{const p=$("#lp").value;const n=await tryLogin($("#lu").value,p);if(!n){$("#le").textContent="اليوزر أو الباسورد غلط";return}$("#le").textContent="جاري الدخول…";try{await signIn(n,p)}catch(e){}};
async function signIn(n,p){const em=n+"@fahoula.app",pw=p+"_fh26";try{await signInWithEmailAndPassword(auth,em,pw)}catch(e){try{await createUserWithEmailAndPassword(auth,em,pw)}catch(e2){$("#le").textContent=e2.code==="auth/email-already-in-use"?"اليوزر أو الباسورد غلط":"تعذر الدخول (التسجيل الجديد مقفول)";throw e2}}}
$("#lp").addEventListener("keydown",e=>{if(e.key==="Enter")$("#lb").click()});
onAuthStateChanged(auth,u=>{if(u&&u.email){const n=u.email.split("@")[0];if(U[n]&&!me)start(n)}});
/* start */
async function start(n){me=n;$("#login").hidden=true;$("#app").hidden=false;renderMe();renderSide();
const er=e=>{console.error(e);toast("تعذر تحميل البيانات")};
const mk=d=>({id:d.id,...d.data()});
const lsn=(c,f)=>onSnapshot(collection(F,c),x=>{f(x.docs.map(mk));renderSide();renderHead();if(c==="meta")renderChat()},er);
let gm=[],dm=[];const mm=()=>{msgs=[...gm,...dm].sort((a,b)=>a.t-b.t);renderSide();renderChat()};
onSnapshot(query(collection(F,"msgs"),where("chat","==","g")),x=>{gm=x.docs.map(mk);mm()},er);

lsn("presence",a=>{pres={};a.forEach(d=>pres[d.id]=d.t)});lsn("profiles",a=>{prof={};a.forEach(d=>prof[d.id]=d)});lsn("stories",a=>stories=a);
lsn("meta",a=>{meta={};a.forEach(d=>meta[d.id]=d);meta.pin=meta.pin&&meta.pin.text?meta.pin:null;const g=k=>meta[k]&&meta[k].v;meta.gname=g("gname")||"";meta.gimg=g("gimg")||"";meta.gdesc=g("gdesc")||"";meta.lock=!!g("lock");meta.mutes=g("mutes")||[]});
beat();setInterval(beat,20000);setInterval(()=>{renderSide();renderHead()},30000)}
function beat(){if(db)db.collection("presence").doc(me).set({t:Date.now()}).catch(()=>{})}
function werr(e){toast(e&&e.code==="permission-denied"?"ما عندك صلاحية الكتابة":"تعذر تنفيذ العملية")}

ORDER.filter(u=>hasSt(u)).forEach(u=>sr.append(h("div",{class:"st",onclick:()=>viewSt(u)},av(u,48),u)));
const L=$("#list");L.replaceChildren();
const gl=last("g");L.append(item("g","📌 "+gname(),gl?(gl.from===me?"أنت":dn(gl.from))+": "+pv(gl):"جروب الكل",gl&&gl.t));
ORDER.filter(u=>u!==me).sort((a,b)=>(online(b)-online(a))||((last(cid(b))||{t:0}).t-(last(cid(a))||{t:0}).t)).forEach(u=>{const l=last(cid(u));L.append(item(u,dn(u),l?pv(l):(online(u)?"متصل الآن":"غير متصل"),l&&l.t))})}
function item(u,name,prev,t){const a=av(u);if(u!=="g")a.onclick=e=>{if(hasSt(u)){e.stopPropagation();viewSt(u)}};
return h("button",{class:"it"+(cur===u?" on":""),onclick:()=>openChat(u)},a,h("div",{class:"tx"},h("div",{class:"n"},name,h("small",{},t?tm(t):"")),h("div",{class:"p"},prev)))}
function openChat(u){cur=u;$("#app").classList.add("open");$("#empty").hidden=true;$("#chat").hidden=false;renderHead();renderChat(true);renderSide();$("#mi").focus()}
$("#bk").onclick=e=>{e.stopPropagation();cur=null;$("#app").classList.remove("open");$("#chat").hidden=true;$("#empty").hidden=false;renderSide()};

else{$("#cn").textContent=dn(cur);$("#cs").textContent=cur===ADMIN?"الفحل":online(cur)?"متصل الآن":"غير متصل"}}

function body(m){if(m.del)return"🚫 تم حذف هذه الرسالة";const u=m.url&&m.url.startsWith("data:")?m.url:"",st=e=>e.stopPropagation();if(m.kind==="image"&&u)return h("img",{src:u});if(m.kind==="video"&&u)return h("video",{src:u,controls:"",preload:"metadata",playsinline:"",onclick:st});if(m.kind==="audio"&&u)return h("audio",{src:u,controls:"",preload:"metadata",onclick:st});return(m.fw?"↪ ":"")+m.text}

async function up(f,m=960){if(f.type.startsWith("image/"))try{return{url:await img(f,m)}}catch(e){toast("تعذر قراءة الصورة");return null}if(f.type.startsWith("audio/")){if(f.size>550e3){toast("الصوت كبير (الحد 550KB)");return null}return{url:await rd(f)}}toast("الفيديو مش متاح دلوقتي");return null}
